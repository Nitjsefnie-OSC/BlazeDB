# Manual CI wrapper for the Nitjsefnie-OSC fork of BlazeDB.
#
# Generic on purpose: it takes any ref in this repository via `target_ref` and
# runs the repository's own preflight gate (swift build + Tier 0) on Linux with
# Swift 6.2. The toolchain setup mirrors the upstream PR-gate "Linux (Swift 6.2)"
# job in .github/workflows/ci.yml. No per-branch logic belongs in this file.

name: OSC Manual Preflight

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag or SHA in this repository to test"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux-preflight:
    name: Linux (Swift 6.2) — preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout target_ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Provenance
        run: |
          echo "Tested commit: $(git rev-parse HEAD) (resolved from target_ref '${{ inputs.target_ref }}')"
          git log -1 --format='%H%n%an%n%s'

      - name: Setup Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Swift version
        run: swift --version

      - name: SwiftPM cache identity
        id: cache-identity
        run: |
          set -euo pipefail
          workspace="$(printf '%s' "$(git rev-parse --show-toplevel)" | git hash-object --stdin)"
          toolchain="$(swift --version | sed -n '1p' | git hash-object --stdin)"
          echo "workspace=${workspace:0:12}" >> "$GITHUB_OUTPUT"
          echo "toolchain=${toolchain:0:12}" >> "$GITHUB_OUTPUT"
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "save=1" >> "$GITHUB_OUTPUT"
          else
            echo "save=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache SwiftPM build
        id: spm-cache
        uses: actions/cache/restore@v5
        with:
          path: .build
          key: ${{ runner.os }}-osc-manual-spm-${{ steps.cache-identity.outputs.workspace }}-${{ steps.cache-identity.outputs.toolchain }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-osc-manual-spm-${{ steps.cache-identity.outputs.workspace }}-${{ steps.cache-identity.outputs.toolchain }}-

      # Scripts/check-durability-lane-integrity.sh (invoked by the Tier 0 gate)
      # shells out to ripgrep, which the ubuntu runner image does not ship.
      # Upstream's Linux lane calls `swift test` directly and so never needs it.
      - name: Install preflight host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      - name: Prepare log directories
        run: mkdir -p .logs .artifacts

      - name: Preflight (swift build + Tier 0)
        run: |
          set -euo pipefail
          ./Scripts/preflight.sh 2>&1 | tee .logs/preflight.log

      - name: Save SwiftPM build cache
        if: always() && steps.spm-cache.outputs.cache-hit != 'true' && steps.cache-identity.outputs.save == '1'
        uses: actions/cache/save@v5
        with:
          path: .build
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          mkdir -p .logs
          df -h > .logs/disk.txt || true
          swift --version > .logs/swift-version.txt 2>&1 || true

      - name: Upload preflight logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: osc-manual-preflight-logs
          path: |
            .logs/
            .artifacts/
          if-no-files-found: ignore
          retention-days: 7
