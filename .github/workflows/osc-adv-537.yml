    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      # Pre-set on GitHub runner images; conflicts with the Swift Android SDK bundle.
      ANDROID_NDK_ROOT: ""

    steps:
      - name: Checkout target_ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
