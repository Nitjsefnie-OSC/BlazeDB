            android-swift-sdk-artifact-6.3.2-

      - name: Cache OSS Swift host toolchain
        uses: actions/cache/restore@v5
        with:
          path: .swift-host
          key: android-host-swift-6.3.2-${{ hashFiles('Scripts/android-swift-config.sh') }}
          restore-keys: |
            android-host-swift-6.3.2-

      - name: Cache Android NDK
        uses: actions/cache/restore@v5
        with:
          path: |
            .artifacts/android-sdk/swift-6.3.2-RELEASE_android.artifactbundle/swift-android/android-ndk-r27d
